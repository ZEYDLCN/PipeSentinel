name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests + F01-F06 eval seti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Unit tests (DB gerektirmez)
        run: pytest -q

      - name: F01-F06 regression eval seti (tespit + RCA Top-1 accuracy)
        run: python -m evals.graders.grader

  integration:
    name: Integration testleri (canlı PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: pipeline_sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d pipeline_sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/pipeline_sentinel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Migrate
        run: sentinel migrate

      - name: Integration testleri (orchestrator + lineage + RCA + API)
        run: pytest -m integration -q
